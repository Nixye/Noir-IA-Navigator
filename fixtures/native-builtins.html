<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Estruturas nativas — Noir</title>
<style>body{font:16px sans-serif;background:#17202a;color:#e1e7ec;margin:28px}pre{white-space:pre-wrap;background:#253445;padding:16px}</style></head>
<body><h1>Map, Set, Symbol, buffers e datas UTC</h1><p>Fixture manual. Nenhum resultado de execução foi registrado.</p><pre id="out"></pre>
<script>
let output='';
function line(text){output+=text+'\n';}
const map=new Map([['alpha',1],['beta',2]]);
map.set(NaN,'nan');
line('Map.size='+map.size+'; NaN='+map.get(NaN));
for(const pair of map){line('Map entry: '+pair[0]+' = '+pair[1]);}
const set=new Set('noir');set.add('n');
line('Set.size='+set.size+'; tem n='+set.has('n'));
const first=Symbol('item');const second=Symbol('item');
line('Symbols distintos: '+(first!==second));
line('Registro compartilhado: '+(Symbol.for('noir')===Symbol.for('noir')));
line('Descrição ausente: '+(Symbol().description===undefined));
const object={visible:1};object[first]='symbol property';
line('Valor pela chave Symbol: '+object[first]);
const buffer=new ArrayBuffer(16);const view=new DataView(buffer);
view.setUint32(0,0x12345678,true);
const bytes=new Uint8Array(buffer);
line('Bytes compartilhados: '+bytes[0]+','+bytes[1]+','+bytes[2]+','+bytes[3]);
const shared=bytes.subarray(1,3);shared[0]=99;
line('Subarray compartilha buffer: '+bytes[1]);
const copy=bytes.slice(0,4);copy[0]=0;
line('Slice é independente: '+bytes[0]);
const clamped=new Uint8ClampedArray([300,-4,2.5,3.5]);
line('Clamping: '+clamped.join(','));
const instant=new Date(Date.UTC(2026,10,8,12,30,0,125));
line('Data UTC: '+instant.toISOString());
instant.setUTCDate(9);line('Dia UTC alterado: '+instant.getUTCDate());
document.getElementById('out').textContent=output;
</script></body></html>
